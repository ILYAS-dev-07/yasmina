<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Не скучай!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* Нежный розово-желтый градиент */
      background: linear-gradient(135deg, #fff0f6 0%, #fff9db 100%);
      color: #4a4a4a;
      overflow: hidden;
    }
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3);
      text-align: center;
      max-width: 360px;
      border: 2px solid #fff;
    }
    .emoji {
      font-size: 50px;
      margin-bottom: 10px;
      animation: pulse 1.5s infinite ease-in-out;
    }
    h1 {
      font-size: 32px;
      font-weight: 800;
      /* Сочетание розового и желтого в тексте */
      background: linear-gradient(45deg, #ff6b8b, #fcc419);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      color: #777;
      margin-bottom: 24px;
    }
    button {
      background: linear-gradient(45deg, #ff87a8, #ffd43b);
      border: none;
      color: white;
      font-weight: bold;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 135, 168, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 135, 168, 0.6);
    }
    button:active {
      transform: translateY(1px);
    }
    /* Летающие сердечки при клике */
    .heart {
      position: absolute;
      font-size: 20px;
      pointer-events: none;
      animation: floatUp 1s forwards ease-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="emoji">🌸</div>
    <h1>Не скучай!</h1>
    <p id="subtext">👇</p>
    <button onclick="sendLove(event)">!Нажми!</button>
  </div>

  <script>
    const messages = [
      "Самой красивой",
      "Самой лучшей",
      "Самой милой",
      "Лови виртуальный обним!"
    ];

    function sendLove(event) {
      // Меняем подпись
      const subtext = document.getElementById('subtext');
      const randomMsg = messages[Math.floor(Math.random() * messages.length)];
      subtext.textContent = randomMsg;

      // Создаем летающие сердечки
      for (let i = 0; i < 5; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.textContent = ['💖', '💛', '🌸', '✨'][Math.floor(Math.random() * 4)];
        heart.style.left = (event.clientX + (Math.random() * 60 - 30)) + 'px';
        heart.style.top = (event.clientY + (Math.random() * 60 - 30)) + 'px';
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 1000);
      }
    }
  </script>

</body>
</html>
